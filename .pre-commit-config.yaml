files: "conda_package"
default_stages: [pre-commit]
fail_fast: true

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    # pcd.yaml is an exact copy of E3SM's share/pcd.yaml
    -   id: trailing-whitespace
        exclude: "conda_package/mpas_tools/constants/pcd.yaml"
    -   id: end-of-file-fixer
        exclude: "conda_package/mpas_tools/constants/pcd.yaml"

  # Can run individually with `flynt [file]` or `flynt [source]`
-   repo: https://github.com/ikamensh/flynt
    rev: '1.0.6'
    hooks:
    -   id: flynt
        args: ["--fail-on-change", "--verbose"]
        require_serial: true

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # Sort the imports
    -   id: ruff-check
        name: ruff-sort-imports
        args: [--select, I, --fix]
      # Run the linter.
    -   id: ruff-check
        args: [--fix]
      # Run the formatter.
    -   id: ruff-format

